<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Build Track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{
  --ink:#1B1A17;
  --ink-soft:#3A3833;
  --paper:#F3EDE1;
  --paper-alt:#EAE1CE;
  --paper-deep:#DED2B4;
  --card:#FBF8F1;
  --rust:#C1541C;
  --rust-dark:#9C4216;
  --rust-tint:#F3D9C9;
  --brass:#B98A2E;
  --brass-tint:#F1E3C3;
  --slate:#35606B;
  --slate-tint:#D7E4E5;
  --moss:#4C7A52;
  --moss-tint:#DCE9DA;
  --danger:#B0402E;
  --danger-tint:#F3D7CF;
  --line: rgba(27,26,23,0.16);
  --line-strong: rgba(27,26,23,0.32);
  --shadow-hard: 3px 3px 0 var(--ink);
  --shadow-hard-sm: 2px 2px 0 var(--ink);
  --radius: 7px;
  --font-head:'Zilla Slab', serif;
  --font-body:'IBM Plex Sans', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(27,26,23,0.05) 1px, transparent 0);
  background-size:22px 22px;
}
h1,h2,h3,h4{font-family:var(--font-head); margin:0; font-weight:700; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:var(--font-body); cursor:pointer;}
input,select,textarea{font-family:var(--font-body);}
.mono{font-family:var(--font-mono);}

/* ===== Layout ===== */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:216px; flex-shrink:0; background:var(--ink); color:var(--paper);
  display:flex; flex-direction:column; padding:20px 14px; gap:6px;
  position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 6px 18px; border-bottom:1px solid rgba(243,237,225,0.18); margin-bottom:14px;}
.brand img{width:42px; height:42px; border-radius:50%; border:2px solid var(--rust); display:block; object-fit:cover;}
.brand-text{font-family:var(--font-head); font-weight:700; font-size:16.5px; line-height:1.15; color:var(--paper);}
.brand-text span{display:block; font-size:10.5px; font-family:var(--font-mono); font-weight:400; letter-spacing:0.04em; color:var(--rust); margin-top:3px;}

.nav-btn{
  display:flex; align-items:center; gap:11px; background:none; border:none; color:rgba(243,237,225,0.78);
  padding:10px 12px; border-radius:6px; font-size:14.5px; font-weight:500; text-align:left; width:100%;
  transition:background .12s ease, color .12s ease;
}
.nav-btn:hover{background:rgba(243,237,225,0.08); color:var(--paper);}
.nav-btn.active{background:var(--rust); color:#fff;}
.nav-btn svg{width:18px; height:18px; flex-shrink:0;}
.sidebar-footer{margin-top:auto; padding:10px 12px; font-size:11px; color:rgba(243,237,225,0.45); font-family:var(--font-mono);}

.content{flex:1; min-width:0; padding:26px 34px 60px;}
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:14px; flex-wrap:wrap;}
.topbar h1{font-size:26px;}
.topbar .sub{font-size:13.5px; color:var(--ink-soft); margin-top:3px;}
.currency-badge{
  font-family:var(--font-mono); font-size:12.5px; font-weight:500; background:var(--card); border:1.5px solid var(--ink);
  padding:6px 12px; border-radius:20px; box-shadow:var(--shadow-hard-sm);
}

.tab-panel{display:none;}
.tab-panel.active{display:block; animation:fade-in .18s ease;}
@keyframes fade-in{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

/* ===== Cards & general components ===== */
.card{
  background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius);
  box-shadow:var(--shadow-hard); padding:18px 20px;
}
.section-title{font-size:15px; text-transform:none; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.section-title .tick{width:5px; height:16px; background:var(--rust); display:inline-block; border-radius:2px;}

.stat-row{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:22px;}
.stat-card{background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow-hard-sm); padding:14px 16px;}
.stat-card .label{font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.03em;}
.stat-card .value{font-family:var(--font-mono); font-size:22px; font-weight:600; margin-top:5px;}
.stat-card.rust .value{color:var(--rust-dark);}
.stat-card.brass .value{color:var(--brass);}
.stat-card.slate .value{color:var(--slate);}

.filter-row{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.chip{
  border:1.5px solid var(--ink); background:var(--card); padding:6px 14px; border-radius:20px; font-size:13px; font-weight:500;
}
.chip.active{background:var(--ink); color:var(--paper);}

.project-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}
.project-card{background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius); box-shadow:var(--shadow-hard); padding:16px 18px; display:flex; flex-direction:column; gap:10px;}
.card-top{display:flex; align-items:center; justify-content:space-between;}
.status-chip{font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; font-family:var(--font-mono); letter-spacing:.02em;}
.status-active{background:var(--rust-tint); color:var(--rust-dark);}
.status-completed{background:var(--moss-tint); color:#2E4E33;}
.status-planning{background:var(--slate-tint); color:var(--slate);}
.chip-btn{background:none; border:1px solid var(--line-strong); border-radius:6px; padding:4px 9px; font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:4px;}
.chip-btn:hover{border-color:var(--ink);}
.project-card h3{font-size:18px;}
.dates-row{font-size:12px; color:var(--ink-soft); font-family:var(--font-mono);}

.bar-row{display:flex; flex-direction:column; gap:4px;}
.bar-label{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft);}
.bar-label b{color:var(--ink); font-family:var(--font-mono); font-weight:600;}
.bar-track{height:9px; background:var(--paper-deep); border-radius:5px; border:1px solid var(--line-strong); overflow:hidden;}
.bar-fill{height:100%; border-radius:5px; transition:width .25s ease;}
.bar-fill.progress{background:var(--slate);}
.bar-fill.budget{background:var(--brass);}
.bar-fill.budget.over{background:var(--danger);}

.details-panel{border-top:1px dashed var(--line-strong); padding-top:10px; margin-top:2px; display:flex; flex-direction:column; gap:6px; font-size:13px;}
.details-panel[hidden]{display:none;}
.details-panel .row{display:flex; justify-content:space-between;}
.details-panel .row span:first-child{color:var(--ink-soft);}
.details-panel .row span:last-child{font-family:var(--font-mono); font-weight:600;}
.details-panel .row.profit-neg span:last-child{color:var(--danger);}
.details-panel .row.profit-pos span:last-child{color:#2E4E33;}

.empty-state{border:1.5px dashed var(--line-strong); border-radius:var(--radius); padding:40px 24px; text-align:center; color:var(--ink-soft);}
.empty-state h3{font-size:17px; margin-bottom:6px; color:var(--ink);}
.empty-state p{font-size:13.5px; margin-bottom:16px;}

/* ===== Forms ===== */
.form-card{margin-bottom:22px;}
.form-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-bottom:6px;}
.field{display:flex; flex-direction:column; gap:5px;}
.field.full{grid-column:1 / -1;}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.field .hint{font-size:11px; color:var(--ink-soft); font-weight:400;}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{
  border:1.5px solid var(--line-strong); background:var(--paper); border-radius:6px; padding:9px 11px; font-size:14px; color:var(--ink);
  outline:none; transition:border-color .12s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--rust);}
input[type=range]{accent-color:var(--slate);}
.range-row{display:flex; align-items:center; gap:10px;}
.range-row input[type=number]{width:70px;}
.form-actions{display:flex; gap:10px; margin-top:10px; align-items:center;}

.btn{
  border:1.5px solid var(--ink); border-radius:6px; padding:9px 18px; font-size:13.5px; font-weight:600; background:var(--card);
  box-shadow:var(--shadow-hard-sm); transition:transform .08s ease;
}
.btn:active{transform:translate(2px,2px); box-shadow:0 0 0 var(--ink);}
.btn-primary{background:var(--rust); color:#fff; border-color:var(--rust-dark);}
.btn-brass{background:var(--brass); color:#fff; border-color:#8C6A21;}
.btn-slate{background:var(--slate); color:#fff; border-color:#233F47;}
.btn-ghost{background:var(--card);}
.btn-danger{background:var(--danger); color:#fff; border-color:#7C2C1E;}
.btn-sm{padding:6px 12px; font-size:12.5px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.icon-btn{border:1px solid var(--line-strong); background:var(--card); border-radius:6px; width:30px; height:30px; display:inline-flex; align-items:center; justify-content:center;}
.icon-btn:hover{border-color:var(--ink);}
.icon-btn.danger:hover{border-color:var(--danger); color:var(--danger);}

/* ===== Lists/tables ===== */
.list{display:flex; flex-direction:column; gap:10px;}
.list-row{
  background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius); padding:12px 16px;
  display:flex; align-items:center; gap:14px; box-shadow:var(--shadow-hard-sm);
}
.list-row .grow{flex:1; min-width:0;}
.list-row .title{font-weight:600; font-size:14.5px;}
.list-row .meta{font-size:12px; color:var(--ink-soft); font-family:var(--font-mono); margin-top:2px;}
.list-row .actions{display:flex; gap:6px; flex-shrink:0;}
.row-thumb{width:44px; height:44px; border-radius:6px; border:1.5px solid var(--ink); object-fit:cover; flex-shrink:0; cursor:pointer;}
.row-thumb.placeholder{display:flex; align-items:center; justify-content:center; background:var(--paper-alt); color:var(--ink-soft);}

table.data-table{width:100%; border-collapse:collapse; font-size:13px;}
table.data-table th{text-align:left; font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); padding:8px 10px; border-bottom:1.5px solid var(--ink);}
table.data-table td{padding:9px 10px; border-bottom:1px solid var(--line);}
table.data-table tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; border:1.5px solid var(--ink); border-radius:var(--radius); background:var(--card); box-shadow:var(--shadow-hard);}
.table-wrap table{box-shadow:none; border:none;}
.cat-tag{font-size:11px; font-weight:600; padding:3px 8px; border-radius:5px; font-family:var(--font-mono);}
.cat-Materials{background:var(--brass-tint); color:var(--brass);}
.cat-Hardware{background:var(--slate-tint); color:var(--slate);}
.cat-Tools{background:var(--rust-tint); color:var(--rust-dark);}
.cat-Labour{background:var(--moss-tint); color:#2E4E33;}
.cat-Miscellaneous{background:var(--paper-deep); color:var(--ink-soft);}

/* ===== Modal / lightbox / toast ===== */
.overlay{position:fixed; inset:0; background:rgba(27,26,23,0.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.overlay[hidden]{display:none;}
.modal{background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius); box-shadow:6px 6px 0 var(--ink); padding:22px 24px; max-width:380px; width:100%;}
.modal h3{font-size:17px; margin-bottom:10px;}
.modal p{font-size:14px; color:var(--ink-soft); margin-bottom:18px; line-height:1.5;}
.modal .actions{display:flex; gap:10px; justify-content:flex-end;}
.lightbox-img{max-width:88vw; max-height:82vh; border-radius:6px; border:2px solid var(--paper);}
.lightbox-overlay{background:rgba(10,10,9,0.86);}

.toast-wrap{position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:200;}
.toast{
  background:var(--ink); color:var(--paper); padding:11px 16px; border-radius:6px; font-size:13.5px; box-shadow:3px 3px 0 var(--rust);
  animation:toast-in .18s ease;
}
.toast.error{box-shadow:3px 3px 0 var(--danger);}
@keyframes toast-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.select-bar{display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.select-bar select{min-width:230px;}
.info-strip{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:20px;}
.info-pill{background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius); padding:11px 14px; box-shadow:var(--shadow-hard-sm);}
.info-pill .l{font-size:11px; color:var(--ink-soft); font-family:var(--font-mono); text-transform:uppercase;}
.info-pill .v{font-family:var(--font-mono); font-weight:600; font-size:15px; margin-top:3px;}

.receipt-input-row{display:flex; align-items:center; gap:10px;}
.receipt-preview{width:52px; height:52px; border-radius:6px; border:1.5px solid var(--ink); object-fit:cover;}

.settings-block{margin-bottom:20px;}
.settings-block h4{font-size:14px; margin-bottom:4px;}
.settings-block .desc{font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;}

.link-pill{display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--slate); text-decoration:none; font-family:var(--font-mono);}
.link-pill:hover{text-decoration:underline;}

.report-preview{margin-top:18px;}
.expense-log-empty{font-size:13px; color:var(--ink-soft); padding:14px;}

/* mobile */
@media (max-width:860px){
  .app{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:sticky; top:0; flex-direction:row; align-items:center; overflow-x:auto; padding:10px 12px; z-index:50;}
  .brand{border-bottom:none; margin-bottom:0; padding:2px 10px 2px 0;}
  .brand-text{display:none;}
  .nav-btn{flex-direction:column; gap:3px; font-size:10.5px; padding:6px 10px; white-space:nowrap;}
  .sidebar-footer{display:none;}
  .content{padding:18px 16px 50px;}
  .stat-row{grid-template-columns:repeat(2,minmax(0,1fr));}
  .form-grid{grid-template-columns:1fr;}
  .info-strip{grid-template-columns:repeat(2,minmax(0,1fr));}
  .topbar h1{font-size:21px;}
}
</style>
</head>

/* ============ My Build Track — application logic ============ */

const LOGO_DATA_URL = document.querySelector('.brand img').src;

const state = {
  projects: [],
  activities: [],
  expenses: [],
  settings: { version: '1.0.0', currency: 'USD' },
  ui: {
    activeTab: 'dashboard',
    dashboardFilter: 'all',
    expandedProjectIds: new Set(),
    progressProjectId: null,
    expenseProjectId: null,
    reportProjectId: null,
    editingProjectId: null,
    editingActivityId: null,
    editingExpenseId: null,
    pendingReceiptDataUrl: null,
    pendingReceiptChanged: false,
    editingExpenseHasReceipt: false,
    receiptMap: {},
    lastReport: null,
    confirmResolve: null
  }
};

/* ---------- storage helpers (browser localStorage) ---------- */
const LS_PREFIX = 'mybuildtrack:';
async function safeGet(key, fallback){
  try{
    const raw = localStorage.getItem(LS_PREFIX + key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
async function saveKey(key, value){
  try{
    localStorage.setItem(LS_PREFIX + key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error('save failed', key, e);
    showToast('Could not save changes — your device storage may be full.', 'error');
    return false;
  }
}
async function saveProjects(){ return saveKey('projects', state.projects); }
async function saveActivities(){ return saveKey('activities', state.activities); }
async function saveExpenses(){ return saveKey('expenses', state.expenses); }
async function saveSettings(){ return saveKey('settings', state.settings); }

async function saveReceipt(id, dataUrl){
  try{ localStorage.setItem(LS_PREFIX + 'receipt:' + id, dataUrl); return true; }
  catch(e){ showToast('Could not save receipt photo — try a smaller image.', 'error'); return false; }
}
async function getReceipt(id){
  try{ return localStorage.getItem(LS_PREFIX + 'receipt:' + id); }
  catch(e){ return null; }
}
async function deleteReceipt(id){
  try{ localStorage.removeItem(LS_PREFIX + 'receipt:' + id); }catch(e){}
}

async function loadAll(){
  state.projects = await safeGet('projects', []);
  state.activities = await safeGet('activities', []);
  state.expenses = await safeGet('expenses', []);
  state.settings = await safeGet('settings', { version:'1.0.0', currency:'USD' });
}

/* ---------- utilities ---------- */
function genId(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function currencySymbol(){ return {USD:'$', AUD:'A$', INR:'\u20B9'}[state.settings.currency] || '$'; }
function formatCurrency(n){
  const v = isFinite(n) ? n : 0;
  return currencySymbol() + v.toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
}
function formatNum(n){ return isFinite(n) ? Math.round(n*100)/100 : 0; }
function formatDate(iso){
  if(!iso) return '\u2014';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
}
function todayIso(){ return new Date().toISOString().slice(0,10); }

function showToast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type === 'error' ? ' error' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; setTimeout(()=>el.remove(), 260); }, 2400);
}

function askConfirm(title, msg){
  return new Promise(resolve => {
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMsg').textContent = msg;
    document.getElementById('confirmOverlay').hidden = false;
    state.ui.confirmResolve = resolve;
  });
}
function closeConfirm(result){
  document.getElementById('confirmOverlay').hidden = true;
  if(state.ui.confirmResolve){ state.ui.confirmResolve(result); state.ui.confirmResolve = null; }
}

/* ---------- computed helpers ---------- */
function getProject(id){ return state.projects.find(p => p.id === id); }
function getProjectExpenses(pid){ return state.expenses.filter(e => e.projectId === pid); }
function getProjectActivities(pid){ return state.activities.filter(a => a.projectId === pid); }
function computeSpent(pid){
  return getProjectExpenses(pid).reduce((s,e) => s + (Number(e.quantity)||0) * (Number(e.unitCost)||0), 0);
}
function computeProgress(pid){
  const acts = getProjectActivities(pid);
  if(!acts.length) return 0;
  return Math.round(acts.reduce((s,a) => s + (Number(a.percent)||0), 0) / acts.length);
}
function computeProfit(pid){
  const p = getProject(pid);
  return (p ? Number(p.budget)||0 : 0) - computeSpent(pid);
}
function statusClass(status){
  return { Active:'status-active', Completed:'status-completed', Planning:'status-planning' }[status] || 'status-planning';
}

/* ---------- tab switching ---------- */
const TAB_META = {
  dashboard: { title:'Dashboard', sub:'Every project on site, at a glance.' },
  projects: { title:'Projects', sub:'Set up and manage every build.' },
  progress: { title:'Progress', sub:'Track activities against the plan.' },
  expenses: { title:'Expenses', sub:'Log every dollar spent on site.' },
  reports: { title:'Reports', sub:'Turn project data into a shareable PDF.' },
  settings: { title:'Settings', sub:'Currency, backups and app info.' }
};

async function switchTab(tab){
  state.ui.activeTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + tab));
  document.getElementById('pageTitle').textContent = TAB_META[tab].title;
  document.getElementById('pageSub').textContent = TAB_META[tab].sub;
  await renderCurrentTab();
}

async function renderCurrentTab(){
  document.getElementById('currencyBadge').textContent = state.settings.currency;
  document.getElementById('sbVersion').textContent = state.settings.version || '1.0.0';
  switch(state.ui.activeTab){
    case 'dashboard': renderDashboard(); break;
    case 'projects': renderProjects(); break;
    case 'progress': renderProgress(); break;
    case 'expenses': await renderExpenses(); break;
    case 'reports': renderReports(); break;
    case 'settings': renderSettings(); break;
  }
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const el = document.getElementById('tab-dashboard');
  if(!state.projects.length){
    el.innerHTML = `
      <div class="empty-state">
        <h3>No projects on the board yet</h3>
        <p>Create your first project to start tracking budget, progress and spend.</p>
        <button class="btn btn-primary" data-action="switch-tab" data-tab="projects">Create a project</button>
      </div>`;
    return;
  }

  const totalBudget = state.projects.reduce((s,p) => s + (Number(p.budget)||0), 0);
  const totalSpent = state.projects.reduce((s,p) => s + computeSpent(p.id), 0);
  const overallProfit = totalBudget - totalSpent;
  const activeCount = state.projects.filter(p => p.status === 'Active').length;

  const filter = state.ui.dashboardFilter;
  const filtered = filter === 'all' ? state.projects : state.projects.filter(p => p.status === filter);

  const cards = filtered.map(p => {
    const spent = computeSpent(p.id);
    const budget = Number(p.budget) || 0;
    const progressPct = computeProgress(p.id);
    const budgetPct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
    const over = spent > budget;
    const profit = budget - spent;
    const expanded = state.ui.expandedProjectIds.has(p.id);
    return `
      <div class="project-card">
        <div class="card-top">
          <span class="status-chip ${statusClass(p.status)}">${escapeHtml(p.status)}</span>
          <button class="chip-btn" data-action="toggle-details" data-id="${p.id}">Details ${expanded ? '\u25B4' : '\u25BE'}</button>
        </div>
        <h3>${escapeHtml(p.title)}</h3>
        <div class="dates-row">${formatDate(p.startDate)} &rarr; ${formatDate(p.endDate)}</div>
        <div class="bar-row">
          <div class="bar-label"><span>Progress</span><b>${progressPct}%</b></div>
          <div class="bar-track"><div class="bar-fill progress" style="width:${progressPct}%"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label"><span>Budget used</span><b>${formatCurrency(spent)} / ${formatCurrency(budget)}</b></div>
          <div class="bar-track"><div class="bar-fill budget ${over ? 'over' : ''}" style="width:${budgetPct}%"></div></div>
        </div>
        <div class="details-panel" ${expanded ? '' : 'hidden'}>
          <div class="row"><span>Budget allocated</span><span>${formatCurrency(budget)}</span></div>
          <div class="row"><span>Amount spent</span><span>${formatCurrency(spent)}</span></div>
          <div class="row ${profit < 0 ? 'profit-neg' : 'profit-pos'}"><span>Profit</span><span>${profit < 0 ? '\u2212' : ''}${formatCurrency(Math.abs(profit))}</span></div>
        </div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="stat-row">
      <div class="stat-card"><div class="label">Projects</div><div class="value">${state.projects.length}</div></div>
      <div class="stat-card rust"><div class="label">Active</div><div class="value">${activeCount}</div></div>
      <div class="stat-card brass"><div class="label">Total budget</div><div class="value">${formatCurrency(totalBudget)}</div></div>
      <div class="stat-card slate"><div class="label">Overall profit</div><div class="value">${formatCurrency(overallProfit)}</div></div>
    </div>
    <div class="filter-row">
      ${['all','Active','Planning','Completed'].map(f => `<button class="chip ${filter===f?'active':''}" data-action="dashboard-filter" data-filter="${f}">${f==='all'?'All':f}</button>`).join('')}
    </div>
    <div class="project-grid">${cards || '<div class="empty-state"><h3>No projects in this filter</h3><p>Try a different status.</p></div>'}</div>
  `;
}

/* ================= PROJECTS ================= */
function renderProjects(){
  const el = document.getElementById('tab-projects');
  const editing = state.ui.editingProjectId ? getProject(state.ui.editingProjectId) : null;

  const rows = state.projects.slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0)).map(p => {
    const spent = computeSpent(p.id);
    return `
      <div class="list-row">
        <div class="grow">
          <div class="title">${escapeHtml(p.title)}</div>
          <div class="meta">${formatDate(p.startDate)} &rarr; ${formatDate(p.endDate)} &middot; Budget ${formatCurrency(Number(p.budget)||0)} &middot; Spent ${formatCurrency(spent)}</div>
        </div>
        <span class="status-chip ${statusClass(p.status)}">${escapeHtml(p.status)}</span>
        <div class="actions">
          <button class="icon-btn" title="Edit project" data-action="edit-project" data-id="${p.id}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="icon-btn danger" title="Delete project" data-action="delete-project" data-id="${p.id}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
          </button>
        </div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="card form-card">
      <div class="section-title"><span class="tick"></span>${editing ? 'Edit project' : 'Create a new project'}</div>
      <form id="projectForm">
        <div class="form-grid">
          <div class="field full">
            <label for="pfTitle">Project title</label>
            <input type="text" id="pfTitle" placeholder="Kitchen extension" required value="${editing ? escapeHtml(editing.title) : ''}">
          </div>
          <div class="field">
            <label for="pfStatus">Status</label>
            <select id="pfStatus">
              <option value="Planning" ${editing && editing.status==='Planning'?'selected':''}>Planning</option>
              <option value="Active" ${!editing || editing.status==='Active'?'selected':''}>Active</option>
              <option value="Completed" ${editing && editing.status==='Completed'?'selected':''}>Completed</option>
            </select>
          </div>
          <div class="field">
            <label for="pfBudget">Budget allocated (${currencySymbol()})</label>
            <input type="number" id="pfBudget" min="0" step="0.01" placeholder="15000" required value="${editing ? editing.budget : ''}">
          </div>
          <div class="field">
            <label for="pfStart">Start date</label>
            <input type="date" id="pfStart" value="${editing ? editing.startDate||'' : ''}">
          </div>
          <div class="field">
            <label for="pfEnd">Finish date</label>
            <input type="date" id="pfEnd" value="${editing ? editing.endDate||'' : ''}">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">${editing ? 'Save changes' : 'Save project'}</button>
          ${editing ? '<button type="button" class="btn btn-ghost" data-action="cancel-edit-project">Cancel</button>' : ''}
        </div>
      </form>
    </div>
    <div class="section-title"><span class="tick"></span>All projects</div>
    <div class="list">${rows || '<div class="empty-state"><h3>Nothing here yet</h3><p>Your saved projects will show up in this list.</p></div>'}</div>
  `;
}

/* ================= PROGRESS ================= */
function renderProgress(){
  const el = document.getElementById('tab-progress');
  if(!state.projects.length){
    el.innerHTML = `<div class="empty-state"><h3>No projects yet</h3><p>Create a project first, then log activities against it here.</p><button class="btn btn-primary" data-action="switch-tab" data-tab="projects">Create a project</button></div>`;
    return;
  }
  if(!state.ui.progressProjectId || !getProject(state.ui.progressProjectId)){
    state.ui.progressProjectId = state.projects[0].id;
  }
  const pid = state.ui.progressProjectId;
  const project = getProject(pid);
  const acts = getProjectActivities(pid).slice().sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
  const editing = state.ui.editingActivityId ? state.activities.find(a => a.id === state.ui.editingActivityId) : null;

  const options = state.projects.map(p => `<option value="${p.id}" ${p.id===pid?'selected':''}>${escapeHtml(p.title)}</option>`).join('');

  const actRows = acts.map(a => `
    <div class="list-row">
      <div class="grow">
        <div class="title">${escapeHtml(a.name)}</div>
        <div class="meta">${formatDate(a.startDate)} &rarr; ${formatDate(a.endDate)}</div>
        <div class="bar-row" style="margin-top:8px; max-width:360px;">
          <div class="bar-track"><div class="bar-fill progress" style="width:${a.percent}%"></div></div>
        </div>
      </div>
      <div class="mono" style="font-weight:600; font-size:15px; width:48px; text-align:right;">${a.percent}%</div>
      <div class="actions">
        <button class="icon-btn" title="Edit activity" data-action="edit-activity" data-id="${a.id}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="icon-btn danger" title="Delete activity" data-action="delete-activity" data-id="${a.id}">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
        </button>
      </div>
    </div>`).join('');

  el.innerHTML = `
    <div class="select-bar">
      <select id="progressProjectSelect">${options}</select>
      <span class="status-chip ${statusClass(project.status)}">${escapeHtml(project.status)}</span>
    </div>
    <div class="info-strip">
      <div class="info-pill"><div class="l">Budget allocated</div><div class="v">${formatCurrency(Number(project.budget)||0)}</div></div>
      <div class="info-pill"><div class="l">Start date</div><div class="v">${formatDate(project.startDate)}</div></div>
      <div class="info-pill"><div class="l">Finish date</div><div class="v">${formatDate(project.endDate)}</div></div>
      <div class="info-pill"><div class="l">Overall progress</div><div class="v">${computeProgress(pid)}%</div></div>
    </div>
    <div class="card form-card">
      <div class="section-title"><span class="tick"></span>${editing ? 'Edit activity' : 'Add an activity'}</div>
      <form id="activityForm">
        <div class="form-grid">
          <div class="field full">
            <label for="afName">Activity name</label>
            <input type="text" id="afName" placeholder="Tile the bathroom floor" required value="${editing ? escapeHtml(editing.name) : ''}">
          </div>
          <div class="field full">
            <label for="afPercentRange">Progress complete</label>
            <div class="range-row">
              <input type="range" id="afPercentRange" min="0" max="100" step="1" value="${editing ? editing.percent : 0}" style="flex:1;">
              <input type="number" id="afPercent" min="0" max="100" step="1" value="${editing ? editing.percent : 0}">
              <span>%</span>
            </div>
          </div>
          <div class="field">
            <label for="afStart">Start date</label>
            <input type="date" id="afStart" value="${editing ? editing.startDate||'' : ''}">
          </div>
          <div class="field">
            <label for="afEnd">Finish date</label>
            <input type="date" id="afEnd" value="${editing ? editing.endDate||'' : ''}">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-slate">${editing ? 'Save changes' : 'Save activity'}</button>
          ${editing ? '<button type="button" class="btn btn-ghost" data-action="cancel-edit-activity">Cancel</button>' : ''}
        </div>
      </form>
    </div>
    <div class="section-title"><span class="tick"></span>Activities for this project</div>
    <div class="list">${actRows || '<div class="empty-state"><h3>No activities logged</h3><p>Break this project into activities to track progress over time.</p></div>'}</div>
  `;
}

/* ================= EXPENSES ================= */
const CATEGORIES = ['Materials','Hardware','Tools','Labour','Miscellaneous'];
const UNITS = ['Pieces/Nos','Kgs','Meter','Hours'];

async function renderExpenses(){
  const el = document.getElementById('tab-expenses');
  if(!state.projects.length){
    el.innerHTML = `<div class="empty-state"><h3>No projects yet</h3><p>Create a project first, then start logging expenses against it.</p><button class="btn btn-primary" data-action="switch-tab" data-tab="projects">Create a project</button></div>`;
    return;
  }
  if(!state.ui.expenseProjectId || !getProject(state.ui.expenseProjectId)){
    state.ui.expenseProjectId = state.projects[0].id;
  }
  const pid = state.ui.expenseProjectId;
  const project = getProject(pid);
  const exps = getProjectExpenses(pid).slice().sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
  const editing = state.ui.editingExpenseId ? state.expenses.find(e => e.id === state.ui.editingExpenseId) : null;

  const receiptIds = exps.filter(e => e.hasReceipt).map(e => e.id);
  const entries = await Promise.all(receiptIds.map(async id => [id, await getReceipt(id)]));
  const thumbMap = Object.fromEntries(entries);

  let editingReceiptUrl = null;
  if(editing && editing.hasReceipt){ editingReceiptUrl = await getReceipt(editing.id); }

  const options = state.projects.map(p => `<option value="${p.id}" ${p.id===pid?'selected':''}>${escapeHtml(p.title)}</option>`).join('');
  const spent = computeSpent(pid);

  const rows = exps.map(e => {
    const total = (Number(e.quantity)||0) * (Number(e.unitCost)||0);
    const thumb = thumbMap[e.id];
    return `
      <div class="list-row">
        ${thumb ? `<img class="row-thumb" src="${thumb}" data-action="view-receipt" data-src="${thumb}" alt="Receipt">` : `<div class="row-thumb placeholder"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg></div>`}
        <div class="grow">
          <div class="title">${escapeHtml(e.description)}</div>
          <div class="meta">
            <span class="cat-tag cat-${e.category}">${escapeHtml(e.category)}</span>
            &nbsp;${e.quantity} ${escapeHtml(e.unit)} &times; ${formatCurrency(Number(e.unitCost)||0)} = <b style="color:var(--ink); font-weight:600;">${formatCurrency(total)}</b>
            ${e.link ? `<br><a class="link-pill" href="${escapeHtml(e.link)}" target="_blank" rel="noopener">Purchase link \u2197</a>` : ''}
          </div>
        </div>
        <div class="actions">
          <button class="icon-btn" title="Edit expense" data-action="edit-expense" data-id="${e.id}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="icon-btn danger" title="Delete expense" data-action="delete-expense" data-id="${e.id}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
          </button>
        </div>
      </div>`;
  }).join('');

  state.ui.editingExpenseHasReceipt = !!(editing && editing.hasReceipt);

  el.innerHTML = `
    <div class="select-bar">
      <select id="expenseProjectSelect">${options}</select>
      <span class="mono" style="font-size:13px; color:var(--ink-soft);">Spent ${formatCurrency(spent)} of ${formatCurrency(Number(project.budget)||0)}</span>
    </div>
    <div class="card form-card">
      <div class="section-title"><span class="tick"></span>${editing ? 'Edit expense' : 'Add an expense'}</div>
      <form id="expenseForm">
        <div class="form-grid">
          <div class="field full">
            <label for="efDesc">Item description</label>
            <input type="text" id="efDesc" placeholder="12mm plywood sheets" required value="${editing ? escapeHtml(editing.description) : ''}">
          </div>
          <div class="field">
            <label for="efCategory">Category</label>
            <select id="efCategory">${CATEGORIES.map(c => `<option value="${c}" ${editing && editing.category===c ? 'selected':''}>${c}</option>`).join('')}</select>
          </div>
          <div class="field">
            <label for="efUnit">Unit of measure</label>
            <select id="efUnit">${UNITS.map(u => `<option value="${u}" ${editing && editing.unit===u ? 'selected':''}>${u}</option>`).join('')}</select>
          </div>
          <div class="field">
            <label for="efQty">Quantity</label>
            <input type="number" id="efQty" min="0" step="0.01" required value="${editing ? editing.quantity : ''}">
          </div>
          <div class="field">
            <label for="efUnitCost">Unit cost (${currencySymbol()})</label>
            <input type="number" id="efUnitCost" min="0" step="0.01" required value="${editing ? editing.unitCost : ''}">
          </div>
          <div class="field full">
            <label for="efLink">Purchase link</label>
            <input type="url" id="efLink" placeholder="https://store.example.com/item" value="${editing ? escapeHtml(editing.link||'') : ''}">
          </div>
          <div class="field full">
            <label for="efReceipt">Receipt photo <span class="hint">optional &mdash; capture or upload</span></label>
            <div class="receipt-input-row">
              <input type="file" id="efReceipt" accept="image/*" capture="environment">
              <img class="receipt-preview" id="efReceiptPreview" style="${editingReceiptUrl ? '' : 'display:none;'}" src="${editingReceiptUrl || ''}" alt="Receipt preview">
            </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-brass">${editing ? 'Save changes' : 'Save expense'}</button>
          ${editing ? '<button type="button" class="btn btn-ghost" data-action="cancel-edit-expense">Cancel</button>' : ''}

  `;
}

/* ================= REPORTS ================= */
function renderReports(){
  const el = document.getElementById('tab-reports');
  if(!state.projects.length){
    el.innerHTML = `<div class="empty-state"><h3>No projects yet</h3><p>Create a project first, then generate a report for it here.</p><button class="btn btn-primary" data-action="switch-tab" data-tab="projects">Create a project</button></div>`;
    return;
  }
  if(!state.ui.reportProjectId || !getProject(state.ui.reportProjectId)){
    state.ui.reportProjectId = state.projects[0].id;
  }
  const pid = state.ui.reportProjectId;
  const project = getProject(pid);
  const exps = getProjectExpenses(pid).slice().sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
  const spent = computeSpent(pid);
  const progress = computeProgress(pid);
  const profit = computeProfit(pid);
  const options = state.projects.map(p => `<option value="${p.id}" ${p.id===pid?'selected':''}>${escapeHtml(p.title)}</option>`).join('');

  const hasReport = state.ui.lastReport && state.ui.lastReport.projectId === pid;

  const logRows = exps.map(e => {
    const total = (Number(e.quantity)||0)*(Number(e.unitCost)||0);
    return `<tr>
      <td>${escapeHtml(e.description)}</td>
      <td><span class="cat-tag cat-${e.category}">${escapeHtml(e.category)}</span></td>
      <td>${e.quantity} ${escapeHtml(e.unit)}</td>
      <td>${formatCurrency(Number(e.unitCost)||0)}</td>
      <td>${formatCurrency(total)}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="select-bar">
      <select id="reportProjectSelect">${options}</select>
      <span class="status-chip ${statusClass(project.status)}">${escapeHtml(project.status)}</span>
    </div>
    <div class="info-strip">
      <div class="info-pill"><div class="l">Budget</div><div class="v">${formatCurrency(Number(project.budget)||0)}</div></div>
      <div class="info-pill"><div class="l">Spent</div><div class="v">${formatCurrency(spent)}</div></div>
      <div class="info-pill"><div class="l">Progress</div><div class="v">${progress}%</div></div>
      <div class="info-pill"><div class="l">Profit</div><div class="v">${profit<0?'\u2212':''}${formatCurrency(Math.abs(profit))}</div></div>
    </div>
    <div class="section-title"><span class="tick"></span>Expense log</div>
    <div class="table-wrap" style="margin-bottom:22px;">
      ${exps.length ? `<table class="data-table"><thead><tr><th>Description</th><th>Category</th><th>Qty</th><th>Unit cost</th><th>Total</th></tr></thead><tbody>${logRows}</tbody></table>` : '<div class="expense-log-empty">No expenses logged for this project yet.</div>'}
    </div>
    <div class="card">
      <div class="section-title"><span class="tick"></span>Generate report</div>
      <p style="font-size:13.5px; color:var(--ink-soft); margin-bottom:14px;">Builds a PDF with this project's budget, dates, progress, status and full expense table, branded with the My Build Track logo.</p>
      <div class="form-actions" style="margin-top:0;">
        <button class="btn btn-primary" data-action="generate-report">Generate PDF report</button>
        <button class="btn btn-ghost" data-action="save-report" ${hasReport?'':'disabled'}>Save (download)</button>
        <button class="btn btn-slate" data-action="share-report" ${hasReport?'':'disabled'}>Share</button>
      </div>
      ${hasReport ? `<div class="report-preview mono" style="font-size:12.5px; color:var(--ink-soft);">Ready: ${escapeHtml(state.ui.lastReport.filename)}</div>` : ''}
    </div>
  `;
}

function generateReport(pid){
  const project = getProject(pid);
  if(!project) return;
  const exps = getProjectExpenses(pid).slice().sort((a,b) => (a.createdAt||0)-(b.createdAt||0));
  const spent = computeSpent(pid);
  const progress = computeProgress(pid);
  const profit = computeProfit(pid);

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const margin = 40;

  try{ doc.addImage(LOGO_DATA_URL, 'PNG', margin, 32, 46, 46); }catch(e){}

  doc.setTextColor(27,26,23);
  doc.setFont('helvetica','bold');
  doc.setFontSize(19);
  doc.text('My Build Track', margin + 58, 54);
  doc.setFont('helvetica','normal');
  doc.setFontSize(10.5);
  doc.setTextColor(90,88,82);
  doc.text('Project report \u2014 generated ' + new Date().toLocaleDateString(), margin + 58, 70);

  doc.setDrawColor(27,26,23);
  doc.setLineWidth(1);
  doc.line(margin, 94, pageWidth - margin, 94);

  doc.setTextColor(27,26,23);
  doc.setFont('helvetica','bold');
  doc.setFontSize(15);
  doc.text(project.title, margin, 122);

  doc.setFont('helvetica','normal');
  doc.setFontSize(10.5);
  const infoLines = [
    ['Status', project.status],
    ['Start date', formatDate(project.startDate)],
    ['Finish date', formatDate(project.endDate)],
    ['Progress complete', progress + '%'],
    ['Budget allocated', formatCurrency(Number(project.budget)||0)],
    ['Amount spent', formatCurrency(spent)],
    ['Profit', (profit<0?'-':'') + formatCurrency(Math.abs(profit))]
  ];
  let y = 144;
  infoLines.forEach(([label, val], i) => {
    const col = i % 2;
    const row = Math.floor(i / 2);
    const x = margin + col * 260;
    const yy = y + row * 20;
    doc.setTextColor(90,88,82);
    doc.text(label + ':', x, yy);
    doc.setTextColor(27,26,23);
    doc.setFont('helvetica','bold');
    doc.text(String(val), x + 110, yy);
    doc.setFont('helvetica','normal');
  });

  const tableStartY = y + Math.ceil(infoLines.length/2) * 20 + 20;
  doc.setFont('helvetica','bold');
  doc.setFontSize(12.5);
  doc.setTextColor(27,26,23);
  doc.text('Expense log', margin, tableStartY);

  const body = exps.map(e => [
    e.description,
    e.category,
    e.quantity + ' ' + e.unit,
    formatCurrency(Number(e.unitCost)||0),
    formatCurrency((Number(e.quantity)||0)*(Number(e.unitCost)||0)),
    e.link || ''
  ]);

  if(doc.autoTable){
    doc.autoTable({
      startY: tableStartY + 12,
      margin: { left: margin, right: margin },
      head: [['Description','Category','Qty / Unit','Unit cost','Total','Purchase link']],
      body: body.length ? body : [['No expenses logged for this project','','','','','']],
      styles: { fontSize: 9, cellPadding: 6, textColor: [27,26,23], lineColor: [200,195,180] },
      headStyles: { fillColor: [27,26,23], textColor: [243,237,225], fontStyle: 'bold' },
      alternateRowStyles: { fillColor: [243,237,225] },
      columnStyles: { 5: { cellWidth: 110 } },
      didDrawPage: (data) => {
        const pageCount = doc.internal.getNumberOfPages();
        doc.setFontSize(8.5);
        doc.setTextColor(120,118,112);
        doc.text('My Build Track \u2014 Page ' + doc.internal.getCurrentPageInfo().pageNumber + ' of ' + pageCount, margin, doc.internal.pageSize.getHeight() - 20);
      }
    });
  }

  const filename = project.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase() + '-report.pdf';
  const blob = doc.output('blob');
  state.ui.lastReport = { blob, filename, projectId: pid };
  showToast('Report generated \u2014 ready to save or share.');
  renderReports();
}

function downloadReport(){
  const r = state.ui.lastReport;
  if(!r) return;
  const url = URL.createObjectURL(r.blob);
  const a = document.createElement('a');
  a.href = url; a.download = r.filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function shareReport(){
  const r = state.ui.lastReport;
  if(!r) return;
  try{
    const file = new File([r.blob], r.filename, { type:'application/pdf' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({ files:[file], title:'My Build Track report', text:r.filename });
      return;
    }
  }catch(e){}
  downloadReport();
  showToast('Sharing isn\u2019t supported here \u2014 downloaded the PDF instead.');
}

/* ================= image resize for receipts ================= */
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * (maxDim/width)); width = maxDim; }
          else{ width = Math.round(width * (maxDim/height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality || 0.72));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ================= form submit handlers ================= */
async function handleProjectSubmit(e){
  e.preventDefault();
  const title = document.getElementById('pfTitle').value.trim();
  const status = document.getElementById('pfStatus').value;
  const budget = parseFloat(document.getElementById('pfBudget').value) || 0;
  const startDate = document.getElementById('pfStart').value;
  const endDate = document.getElementById('pfEnd').value;
  if(!title) return;

  if(state.ui.editingProjectId){
    const p = getProject(state.ui.editingProjectId);
    Object.assign(p, { title, status, budget, startDate, endDate });
    state.ui.editingProjectId = null;
    await saveProjects();
    showToast('Project updated.');
  }else{
    state.projects.push({ id: genId('proj'), title, status, budget, startDate, endDate, createdAt: Date.now() });
    await saveProjects();
    showToast('Project saved.');
  }
  renderProjects();
}

async function handleActivitySubmit(e){
  e.preventDefault();
  const name = document.getElementById('afName').value.trim();
  const percent = Math.max(0, Math.min(100, parseFloat(document.getElementById('afPercent').value) || 0));
  const startDate = document.getElementById('afStart').value;
  const endDate = document.getElementById('afEnd').value;
  if(!name) return;
  const pid = state.ui.progressProjectId;

  if(state.ui.editingActivityId){
    const a = state.activities.find(x => x.id === state.ui.editingActivityId);
    Object.assign(a, { name, percent, startDate, endDate });
    state.ui.editingActivityId = null;
    await saveActivities();
    showToast('Activity updated.');
  }else{
    state.activities.push({ id: genId('act'), projectId: pid, name, percent, startDate, endDate, createdAt: Date.now() });
    await saveActivities();
    showToast('Activity saved.');
  }
  renderProgress();
}

async function handleExpenseSubmit(e){
  e.preventDefault();
  const description = document.getElementById('efDesc').value.trim();
  const category = document.getElementById('efCategory').value;
  const unit = document.getElementById('efUnit').value;
  const quantity = parseFloat(document.getElementById('efQty').value) || 0;
  const unitCost = parseFloat(document.getElementById('efUnitCost').value) || 0;
  const link = document.getElementById('efLink').value.trim();
  if(!description) return;
  const pid = state.ui.expenseProjectId;

  let id;
  if(state.ui.editingExpenseId){
    id = state.ui.editingExpenseId;
    const ex = state.expenses.find(x => x.id === id);
    Object.assign(ex, { description, category, unit, quantity, unitCost, link });
    if(state.ui.pendingReceiptChanged && state.ui.pendingReceiptDataUrl){
      await saveReceipt(id, state.ui.pendingReceiptDataUrl);
      ex.hasReceipt = true;
    }
    state.ui.editingExpenseId = null;
    await saveExpenses();
    showToast('Expense updated.');
  }else{
    id = genId('exp');
    const hasReceipt = !!state.ui.pendingReceiptDataUrl;
    state.expenses.push({ id, projectId: pid, description, category, unit, quantity, unitCost, link, hasReceipt, createdAt: Date.now() });
    if(hasReceipt){ await saveReceipt(id, state.ui.pendingReceiptDataUrl); }
    await saveExpenses();
    showToast('Expense saved.');
  }
  state.ui.pendingReceiptDataUrl = null;
  state.ui.pendingReceiptChanged = false;
  await renderExpenses();
}

/* ================= export / import ================= */
async function exportData(){
  const receiptIds = state.expenses.filter(e => e.hasReceipt).map(e => e.id);
  const receipts = {};
  for(const id of receiptIds){ receipts[id] = await getReceipt(id); }
  const payload = {
    app: 'My Build Track',
    exportedAt: new Date().toISOString(),
    projects: state.projects,
    activities: state.activities,
    expenses: state.expenses,
    settings: state.settings,
    receipts
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'my-build-track-backup-' + todayIso() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  showToast('Data exported.');
}

async function importData(file){
  try{
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || !Array.isArray(data.projects)) throw new Error('bad format');
    const ok = await askConfirm('Replace current data?', 'Importing will overwrite all projects, activities and expenses currently in the app with the contents of this file.');
    if(!ok) return;
    state.projects = data.projects || [];
    state.activities = data.activities || [];
    state.expenses = data.expenses || [];
    state.settings = data.settings || state.settings;
    await saveProjects(); await saveActivities(); await saveExpenses(); await saveSettings();
    if(data.receipts){
      for(const [id, url] of Object.entries(data.receipts)){
        if(url) await saveReceipt(id, url);
      }
    }
    showToast('Data imported.');
    await renderCurrentTab();
  }catch(err){
    showToast('That file could not be read as a My Build Track backup.', 'error');
  }
}

/* ================= event delegation ================= */
const appEl = document.getElementById('app');

appEl.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  if(action === 'switch-tab'){ await switchTab(btn.dataset.tab); return; }

  if(action === 'dashboard-filter'){ state.ui.dashboardFilter = btn.dataset.filter; renderDashboard(); return; }

  if(action === 'toggle-details'){
    const id = btn.dataset.id;
    if(state.ui.expandedProjectIds.has(id)) state.ui.expandedProjectIds.delete(id);
    else state.ui.expandedProjectIds.add(id);
    renderDashboard();
    return;
  }

  if(action === 'edit-project'){ state.ui.editingProjectId = btn.dataset.id; renderProjects(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  if(action === 'cancel-edit-project'){ state.ui.editingProjectId = null; renderProjects(); return; }
  if(action === 'delete-project'){
    const id = btn.dataset.id;
    const p = getProject(id);
    const ok = await askConfirm('Delete project?', `"${p ? p.title : 'This project'}" and all its activities and expenses will be permanently removed.`);
    if(!ok) return;
    const expIds = getProjectExpenses(id).map(e => e.id);
    for(const eid of expIds){ await deleteReceipt(eid); }
    state.projects = state.projects.filter(x => x.id !== id);
    state.activities = state.activities.filter(x => x.projectId !== id);
    state.expenses = state.expenses.filter(x => x.projectId !== id);
    await saveProjects(); await saveActivities(); await saveExpenses();
    showToast('Project deleted.');
    renderProjects();
    return;
  }

  if(action === 'edit-activity'){ state.ui.editingActivityId = btn.dataset.id; renderProgress(); return; }
  if(action === 'cancel-edit-activity'){ state.ui.editingActivityId = null; renderProgress(); return; }
  if(action === 'delete-activity'){
    const id = btn.dataset.id;
    const ok = await askConfirm('Delete activity?', 'This activity entry will be permanently removed.');
    if(!ok) return;
    state.activities = state.activities.filter(x => x.id !== id);
    await saveActivities();
    showToast('Activity deleted.');
    renderProgress();
    return;
  }

  if(action === 'edit-expense'){
    state.ui.editingExpenseId = btn.dataset.id;
    state.ui.pendingReceiptDataUrl = null;
    state.ui.pendingReceiptChanged = false;
    await renderExpenses();
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  if(action === 'cancel-edit-expense'){
    state.ui.editingExpenseId = null;
    state.ui.pendingReceiptDataUrl = null;
    state.ui.pendingReceiptChanged = false;
    await renderExpenses();
    return;
  }
  if(action === 'delete-expense'){
    const id = btn.dataset.id;
    const ok = await askConfirm('Delete expense?', 'This expense entry and its receipt photo (if any) will be permanently removed.');
    if(!ok) return;
    await deleteReceipt(id);
    state.expenses = state.expenses.filter(x => x.id !== id);
    await saveExpenses();
    showToast('Expense deleted.');
    await renderExpenses();
    return;
  }

  if(action === 'view-receipt'){
    document.getElementById('lightboxImg').src = btn.dataset.src;
    document.getElementById('lightboxOverlay').hidden = false;
    return;
  }
  if(action === 'close-lightbox'){
    document.getElementById('lightboxOverlay').hidden = true;
    return;
  }

  if(action === 'confirm-ok'){ closeConfirm(true); return; }
  if(action === 'confirm-cancel'){ closeConfirm(false); return; }

  if(action === 'generate-report'){ generateReport(state.ui.reportProjectId); return; }
  if(action === 'save-report'){ downloadReport(); return; }
  if(action === 'share-report'){ await shareReport(); return; }

  if(action === 'save-version'){
    state.settings.version = document.getElementById('stVersion').value.trim() || '1.0.0';
    await saveSettings();
    document.getElementById('sbVersion').textContent = state.settings.version;
    showToast('Version saved.');
    return;
  }
  if(action === 'save-all'){
    await saveProjects(); await saveActivities(); await saveExpenses(); await saveSettings();
    showToast('All data saved.');
    return;
  }
  if(action === 'export-data'){ await exportData(); return; }
});

appEl.addEventListener('submit', async (e) => {
  if(e.target.id === 'projectForm') return handleProjectSubmit(e);
  if(e.target.id === 'activityForm') return handleActivitySubmit(e);
  if(e.target.id === 'expenseForm') return handleExpenseSubmit(e);
});

appEl.addEventListener('change', async (e) => {
  const id = e.target.id;

  if(id === 'progressProjectSelect'){ state.ui.progressProjectId = e.target.value; state.ui.editingActivityId = null; renderProgress(); return; }
  if(id === 'expenseProjectSelect'){ state.ui.expenseProjectId = e.target.value; state.ui.editingExpenseId = null; await renderExpenses(); return; }
  if(id === 'reportProjectSelect'){ state.ui.reportProjectId = e.target.value; renderReports(); return; }

  if(id === 'afPercentRange'){ document.getElementById('afPercent').value = e.target.value; return; }
  if(id === 'afPercent'){
    let v = Math.max(0, Math.min(100, parseFloat(e.target.value) || 0));
    e.target.value = v;
    document.getElementById('afPercentRange').value = v;
    return;
  }

  if(id === 'efReceipt'){
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await resizeImageFile(file, 900, 0.72);
      state.ui.pendingReceiptDataUrl = dataUrl;
      state.ui.pendingReceiptChanged = true;
      const preview = document.getElementById('efReceiptPreview');
      preview.src = dataUrl;
      preview.style.display = '';
    }catch(err){ showToast('Could not read that photo.', 'error'); }
    return;
  }

  if(id === 'stCurrency'){
    state.settings.currency = e.target.value;
    await saveSettings();
    document.getElementById('currencyBadge').textContent = state.settings.currency;
    showToast('Currency updated.');
    await renderCurrentTab();
    return;
  }

  if(id === 'importFileInput'){
    const file = e.target.files[0];
    if(file) await importData(file);
    e.target.value = '';
    return;
  }
});

document.getElementById('confirmOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'confirmOverlay') closeConfirm(false);
});

(async function init(){
  await loadAll();
  document.getElementById('currencyBadge').textContent = state.settings.currency;
  document.getElementById('sbVersion').textContent = state.settings.version || '1.0.0';
  await switchTab('dashboard');
})();
